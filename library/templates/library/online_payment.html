{% extends 'library/base.html' %}

{% block content %}
<h2>Online Payment</h2>

<form method="POST">
    {% csrf_token %}

    <label>Amount</label>
    {{ form.amount }}

    <label>Payment Method</label>
    {{ form.method }}

    <label>Transaction ID</label>
    {{ form.transaction_id }}

    <button type="submit">Submit Payment</button>
</form>

<a href="{% url 'payment_history' %}">View Payment History</a>
{% endblock %}
