{% extends 'library/base.html' %} {% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'library/css/style.css' %}">

<div class="upload-container">
    <div class="upload-header">
        <h2>Upload Premium Content</h2>
        <p>Fill out the form below to add new premium material to the library</p>
    </div>
    
    <form class="upload-form" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="id_title">Title</label>
            <input type="text" id="id_title" name="title" placeholder="Enter content title..." required>
        </div>

        <div class="form-row-two-col">
            <div class="form-group">
                <label for="id_content_type">Content Type</label>
                <select id="id_content_type" name="content_type">
                    <option value="Notes">Notes</option>
                    <option value="PDF">PDF Booklet</option>
                    <option value="Video">Video Lecture</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="id_price">Price (BDT)</label>
                <input type="number" id="id_price" name="price" placeholder="e.g. 500" required>
            </div>
        </div>

        <div class="form-group">
            <label for="id_description">Description</label>
            <textarea id="id_description" name="description" rows="4" placeholder="Describe the content briefly..."></textarea>
        </div>

        <div class="form-group file-upload-group">
            <label>Upload File (PDF/DOC/VIDEO)</label>
            <div class="file-drop-area">
                <span class="fake-btn">Choose File</span>
                <span class="file-msg">or drag and drop file here</span>
                <input class="file-input" type="file" name="file" id="file-input" required>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Upload Content</button>
            <a href="{% url 'premium_content' %}" class="btn btn-secondary">Cancel</a> </div>
    </form>
</div>

<script>
    document.getElementById('file-input').addEventListener('change', function(e) {
        var fileName = e.target.files[0] ? e.target.files[0].name : "or drag and drop file here";
        document.querySelector('.file-msg').textContent = fileName;
    });
</script>

{% endblock %}
