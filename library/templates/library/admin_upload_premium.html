{% extends 'library/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card" style="background: white; padding: 30px; border-radius: 15px;">
                <h3 class="mb-4">Upload Premium Content</h3>
                
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
                
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="title" class="form-label">Title</label>
                        <input type="text" name="title" id="title" class="form-control" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="content_type" class="form-label">Content Type</label>
                        <select name="content_type" id="content_type" class="form-control">
                            <option value="notes">Notes</option>
                            <option value="courses">Courses</option>
                            <option value="study_material">Study Material</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea name="description" id="description" class="form-control" rows="5"></textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label for="file" class="form-label">Upload File (PDF/DOC/VIDEO)</label>
                        <input type="file" name="file" id="file" class="form-control">
                    </div>
                    
                    <div class="mb-3">
                        <label for="price" class="form-label">Price (BDT)</label>
                        <input type="number" name="price" id="price" class="form-control" step="0.01">
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Upload Content</button>
                    <a href="{% url 'premium_content' %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
