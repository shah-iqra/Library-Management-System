{% extends 'library/base.html' %} 
{% load static %}

{% block content %}


<div class="upload-container">
    <div class="upload-header">
        <h2>Upload Premium Content</h2>
        <p>Fill out the form below to add new premium material to the library</p>
    </div>
    
    <form class="upload-form" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="id_title">Title</label>
            <input type="text" id="id_title" name="title" placeholder="Enter content title..." required>
        </div>

        <div class="form-row-two-col">
            <div class="form-group">
                <label for="id_content_type">Content Type</label>
                <select id="id_content_type" name="content_type">
                    <option value="notes">Notes</option>
                    <option value="course">Course</option>
                </select>
            </div>

            <div class="form-group">
                <label for="id_price">Price (BDT)</label>
                <input type="number" id="id_price" name="price" placeholder="e.g. 500" step="0.01" min="0" required>
            </div>
        </div>

        <div class="form-group">
            <label for="id_description">Description</label>
            <textarea id="id_description" name="description" rows="4" placeholder="Describe the content briefly..."></textarea>
        </div>

        <!-- FILE UPLOAD SECTION -->
        <div class="form-group file-upload-group">
            <label>Upload File (PDF/DOC/VIDEO)</label>
            <div class="file-drop-area" id="drop-area">
                <label for="id_file" class="fake-btn" style="cursor: pointer;">Choose File</label>
                <span class="file-msg" id="file-msg-text">or drag and drop file here</span>
                <input class="file-input" type="file" name="file" id="id_file" required style="display: none;">
            </div>
        </div>

        <!-- ✅ NEW VIDEO URL FIELD -->
        <div class="form-group">
            <label for="id_video_url">YouTube Embed URL (optional)</label>
            <input type="url" id="id_video_url" name="video_url" 
                   class="form-control"
                   placeholder="https://www.youtube.com/embed/VIDEO_ID">
            <small style="color:#888;">
                Embed from YouTube link: 
                watch?v=<b>ABC123</b> → embed/<b>ABC123</b>
            </small>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Upload Content</button>
            <a href="{% url 'premium_content' %}" class="btn btn-secondary">Cancel</a> 
        </div>
    </form>
</div>

<script>
    // File select হলে নাম দেখাও
    document.getElementById('id_file').addEventListener('change', function(e) {
        var fileName = e.target.files[0] ? e.target.files[0].name : "or drag and drop file here";
        document.getElementById('file-msg-text').textContent = fileName;
    });

    // Drag & Drop support
    const dropArea = document.getElementById('drop-area');
    const fileInput = document.getElementById('id_file');

    dropArea.addEventListener('dragover', function(e) {
        e.preventDefault();
        dropArea.style.borderColor = '#2ecc71';
    });

    dropArea.addEventListener('dragleave', function() {
        dropArea.style.borderColor = '';
    });

    dropArea.addEventListener('drop', function(e) {
        e.preventDefault();
        dropArea.style.borderColor = '';
        
        const files = e.dataTransfer.files;
        if (files.length > 0) {
            fileInput.files = files;
            document.getElementById('file-msg-text').textContent = files[0].name;
        }
    });
</script>

{% endblock %}
