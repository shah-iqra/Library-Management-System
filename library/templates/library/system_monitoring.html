{% extends 'library/base.html' %}

{% block content %}

<div class="dashboard-container">

    <h2>🖥 System Monitoring</h2>

    <div class="stats-card">
        <h3>Total Activities: {{ total_logs }}</h3>
    </div>

    <table class="monitor-table">

        <tr>
            <th>User</th>
            <th>Action</th>
            <th>IP Address</th>
            <th>Time</th>
        </tr>

        {% for log in logs %}

        <tr>
            <td>{{ log.user.username }}</td>
            <td>{{ log.action }}</td>
            <td>{{ log.ip_address }}</td>
            <td>{{ log.timestamp }}</td>
        </tr>

        {% endfor %}

    </table>

</div>

{% endblock %}
